server:
  port: 8080
spring:
  application:
    name: meals-coming
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/reggie_take_out?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: root
      password: toor
      # 以下为druid配置，可以共用datasource中的druid配置，需要覆盖时再重新配置
      use-ping-method: false
      max-active: 20   # 最大连接数
      max-wait: 60000   # 最大等待时间，单位毫秒
      time-between-eviction-runs-millis: 60000  # 两次检测连接的间隔时间，单位毫秒
      min-evictable-idle-time-millis: 300000  # 连接在池中最小生存的时间，单位毫秒
      max-evictable-idle-time-millis: 900000  # 连接在池中最大生存的时间，单位毫秒
  redis:
    host: localhost
    port: 6379
    password: 123456
    database: 0 #操作的是0号数据库
  cache:
    redis:
      time-to-live: 1800000 #设置过期时间
mybatis-plus:
  configuration:
    #在映射实体或者属性时，将数据库中表名和字段名中的下划线去掉，按照驼峰命名法映射
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: ASSIGN_ID
reggie:
  imgPath: E:\Code\note-management\reggie_img\

