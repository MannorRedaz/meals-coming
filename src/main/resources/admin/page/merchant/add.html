            </el-form-item>
            <el-form-item label="更新时间:" prop="updateTime" class="flex items-center">
                <el-input v-model="data.updateTime" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>
            <el-form-item label="用户名:" prop="username" class="flex items-center">
                <el-input v-model="data.username" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>

<!--            </el-form-item>-->
            <el-form-item label="联系人姓名:" prop="merchantDetails.name" class="flex items-center">
                <el-input v-model="data.merchantDetails.name" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>
            <el-form-item label="联系人电话:" prop="merchantDetails.phone" class="flex items-center">
                <el-input v-model="data.merchantDetails.phone" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>
            <el-form-item label="联系人性别:" prop="merchantDetails.gender" class="flex items-center">
                <el-input v-model="data.merchantDetails.gender" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>
            <el-form-item label="联系人身份证号:" prop="merchantDetails.idCard" class="flex items-center">
                <el-input v-model="data.merchantDetails.idCard" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>
            <el-form-item label="营业执照:" prop="merchantDetails.businessLicense" class="flex items-center">
                <img :src="data.merchantDetails.businessLicense" alt="营业执照" class="max-w-full h-auto border border-gray-300 rounded-md">
            </el-form-item>
            <el-form-item label="商家地址:" prop="merchantDetails.address" class="flex items-center">
                <el-input v-model="data.merchantDetails.address" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>
            <el-form-item label="审核状态:" prop="auditStatus" class="flex items-center">
                <el-radio-group v-model="data.merchantAudit.auditStatus" class="flex space-x-4">
                    <el-radio label="已通过" class="flex items-center">
                    </el-radio>
                    <el-radio label="未通过" class="flex items-center">
                    </el-radio>
                </el-radio-group>
            </el-form-item>
            <el-form-item label="审核意见:" prop="auditComment" class="flex items-center">
                <el-input v-model="data.merchantAudit.auditComment" readonly class="border border-gray-300 rounded-md px-3 py-2 w-full" />
            </el-form-item>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/merchant.js"></script>
<script src="../../js/validate.js"></script>
<script src="../../js/index.js"></script>
<script>
    new Vue({
        el: '#merchant-audit-modify-app',
        data() {
            return {
                id: '',
                data: {
                    merchantDetails: {},
                    merchantAudit: {}
                }
            };
        },
        computed: {},
        created() {
            const urlParams = new URLSearchParams(window.location.search);
            this.id = urlParams.get('id');
            this.init();
        },
        mounted() {},
        methods: {
            async init() {
                getMerchantDetail(this.id).then(res => {
                    if (res.data.code === 1) {
                        this.data = res.data.data;
                    } else {
                        this.$message.error(res.msg || '操作失败');
                    }
                });
            },
            goBack() {
                window.parent.menuHandle({
                    id: '2',
                    url: '/admin/page/merchant/list.html',
                    name: '商家管理'
                }, false);
            }
        }
    });
</script>
</body>
