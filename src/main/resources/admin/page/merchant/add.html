<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家审核与修改</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/page.css" />
</head>

<body>
<div class="addBrand-container" id="merchant-audit-modify-app">
    <div class="container">
        <el-form ref="ruleForm" :model="ruleForm" :rules="rules" :inline="false" label-width="180px"
                 class="demo-ruleForm">
            <el-form-item label="商家名称:" prop="merchantName">
                <el-input v-model="ruleForm.merchantName" placeholder="请输入商家名称" maxlength="20" />
            </el-form-item>
            <!--      <el-form-item-->
            <!--              label="创建时间:"-->
            <!--              prop="createTime"-->
            <!--      >-->
            <!--        <el-input-->
            <!--                v-model="ruleForm.createTime"-->
            <!--                placeholder="请输入创建时间"-->
            <!--                maxlength="20"-->
            <!--                disabled-->
            <!--        />-->
            <!--      </el-form-item>-->
            <!--      <el-form-item-->
            <!--              label="更新时间:"-->
            <!--              prop="updateTime"-->
            <!--      >-->
            <!--        <el-input-->
            <!--                v-model="ruleForm.updateTime"-->
            <!--                placeholder="请输入更新时间"-->
            <!--                maxlength="20"-->
            <!--                disabled-->
            <!--        />-->
            <!--      </el-form-item>-->
            <el-form-item label="审核状态:" prop="auditStatus">
                <el-radio-group v-model="ruleForm.auditStatus">
                    <el-radio label="已通过">已通过</el-radio>
                    <el-radio label="未通过">未通过</el-radio>
                </el-radio-group>
            </el-form-item>
            <el-form-item label="审核意见:" prop="auditComment">
                <el-input v-model="ruleForm.auditComment" placeholder="请输入审核意见" maxlength="200" />
            </el-form-item>
            <div class="subBox address">
                <el-form-item>
                    <el-button @click="goBack()">
                        取消
                    </el-button>
                    <el-button type="primary" @click="submitForm('ruleForm')">
                        保存
                    </el-button>
                </el-form-item>
            </div>
        </el-form>
    </div>
</div>
<!-- 开发环境版本，包含了有帮助的命令行警告 -->
<script src="../../plugins/vue/vue.js"></script>
<!-- 引入组件库 -->
<script src="../../plugins/element-ui/index.js"></script>
<!-- 引入axios -->
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/merchant.js"></script>
<script src="../../js/validate.js"></script>
<script src="../../js/index.js"></script>
<script>
    new Vue({
        el: '#merchant-audit-modify-app',
        data() {
            return {
                id: '',
                actionType: '',
                ruleForm: {
                    merchantName: '',
                    auditStatus: '已通过',
                    auditComment: ''
                }
            }
        },
        computed: {
            rules() {
                return {
                    // 商家名称
                    merchantName: [
                        {
                            required: true,
                            validator: checkName,
                            trigger: 'blur'
                        }
                    ],
                    // 审核状态
                    auditStatus: [
                        {
                            required: true,
                            message: '请选择审核状态',
                            trigger: 'change'
                        }
                    ],
                    // 审核意见
                    auditComment: [
                        {
                            required: true,
                            message: '请输入审核意见',
                            trigger: 'blur'
                        }
                    ]
                }
            }
        },
        created() {
            this.id = requestUrlParam('id')
            this.actionType = this.id ? 'edit' : 'add'
            if (this.id) {
                this.init()
            }
        },
        mounted() {
        },
        methods: {
            async init() {
                getMerchantInfo(this.id).then(res => {
                    console.error("1234")
                    if (res.data.code === 1) {
                        this.ruleForm = {
                            merchantName: res.data.merchantName,
                            auditStatus: res.data.merchantAudit ? res.data.merchantAudit.auditStatus : '未审核',
                            auditComment: res.data.merchantAudit ? res.data.merchantAudit.auditComment : ''
                        }
                    } else {
                        this.$message.error(res.msg || '操作失败')
                    }
                })
            },
            submitForm(formName) {
                this.$refs[formName].validate((valid) => {
                    if (valid) {
                        const params = {
                            id: this.id,
                            merchantName: this.ruleForm.merchantName,
                            auditStatus: this.ruleForm.auditStatus,
                            auditComment: this.ruleForm.auditComment
                        }
                        if (this.actionType === 'add') {
                            createMerchant(params).then(res => {
                                if (res.code === 1) {
                                    this.$message.success('商家添加成功！')
                                    this.goBack()
                                } else {
                                    this.$message.error(res.msg || '操作失败')
                                }
                            }).catch(err => {
                                this.$message.error('请求出错了：' + err)
                            })
                        } else {
                            updateMerchant(params).then(res => {
                                if (res.code === 1) {
                                    this.$message.success('商家信息修改成功！')
                                    this.goBack()
                                } else {
                                    this.$message.error(res.msg || '操作失败')
                                }
                            }).catch(err => {
                                this.$message.error('请求出错了：' + err)
                            })
                        }
                    } else {
                        console.log('error submit!!')
                        return false
                    }
                })
            },
            goBack() {
                window.parent.menuHandle({
                    id: '2',
                    url: '/admin/page/merchant/list.html',
                    name: '商家管理'
                }, false)
            }
        }
    })
</script>
</body>

</html>
