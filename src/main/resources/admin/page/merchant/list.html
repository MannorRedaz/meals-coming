<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家管理</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="../../plugins/element-ui/index.css" />
    <link rel="stylesheet" href="../../styles/common.css" />
    <link rel="stylesheet" href="../../styles/page.css" />
    <style>
        #merchant-app.notAdmin::after {
            border: 0!important;
        }
    </style>
</head>

<body>
<div class="dashboard-container" id="merchant-app">
    <div class="container">
        <div class="tableBar">
            <el-input v-model="input" placeholder="请输入商家名称" style="width: 250px" clearable
                      @keyup.enter.native="handleQuery">
                <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer"
                   @click="handleQuery"></i>
            </el-input>
            <el-date-picker
                    v-model="createTimeRange"
                    type="daterange"
                    range-separator=""
                    start-placeholder="开始日期"
                    end-placeholder="结束日期"
                    style="width: 250px"
                    @change="handleQuery"
            ></el-date-picker>
            <el-date-picker
                    v-model="updateTimeRange"
                    type="daterange"
                    range-separator=""
                    start-placeholder="开始日期"
                    end-placeholder="结束日期"
                    style="width: 250px"
                    @change="handleQuery"
            ></el-date-picker>
            <el-select
                    v-model="auditStatus"
                    placeholder="请选择审核状态"
                    style="width: 150px"
                    @change="handleQuery"
            >
                <el-option label="已通过" value="已通过"></el-option>
                <el-option label="未通过" value="未通过"></el-option>
                <el-option label="待审核" value="待审核"></el-option>
            </el-select>
            <el-input v-model="auditComment" placeholder="请输入审核意见" style="width: 200px" clearable
                      @keyup.enter.native="handleQuery"></el-input>
            <el-button type="primary" @click="resetQuery">重置</el-button>
            <el-button type="primary" @click="handleQuery">搜索</el-button>
        </div>
        <el-table :data="tableData" stripe class="tableBox">
            <el-table-column prop="merchantName" label="商家名称"></el-table-column>
            <el-table-column prop="createTime" label="创建时间"></el-table-column>
            <el-table-column prop="updateTime" label="更新时间"></el-table-column>
            <el-table-column label="审核状态">
                <template slot-scope="scope">
                    {{ scope.row.merchantAudit? scope.row.merchantAudit.auditStatus : '待审核' }}
                </template>
            </el-table-column>
            <el-table-column label="审核意见">
                <template slot-scope="scope">
                    {{ scope.row.merchantAudit? scope.row.merchantAudit.auditComment : '无' }}
                </template>
            </el-table-column>
            <el-table-column label="操作" width="160" align="center">
                <template slot-scope="scope">
                    <el-button type="text" size="small" class="blueBug"
                               @click="addMerchantHandle(scope.row.id)">
                        详情
                    </el-button>
                    <el-button type="text" size="small" class="delBut non"
                               @click="statusHandle(scope.row)">
                        <span v-if="!scope.row.merchantAudit.auditComment || scope.row.merchantAudit.auditStatus === '待审核'">审核</span>
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
        <el-pagination
                class="pageList"
                :page-sizes="[10, 20, 30, 40]"
                :page-size="pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="counts"
                :current-page.sync="page"
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
        ></el-pagination>
    </div>
</div>
<!-- 开发环境版本，包含了有帮助的命令行警告 -->
<script src="../../plugins/vue/vue.js"></script>
<!-- 引入组件库 -->
<script src="../../plugins/element-ui/index.js"></script>
<!-- 引入axios -->
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/merchant.js"></script>
<script>
    new Vue({
        el: '#merchant-app',
        data() {
            return {
                input: '',
                createTimeRange: [],
                updateTimeRange: [],
                auditStatus: '',
                auditComment: '',
                counts: 0,
                page: 1,
                pageSize: 10,
                tableData: [],
                id: '',
                status: '',
            }
        },
        computed: {},
        created() {
            this.init()
            this.user = JSON.parse(localStorage.getItem('userInfo')).username? JSON.parse(localStorage.getItem('userInfo')).username : '超级管理员'
        },
        mounted() {
        },
        methods: {
            async init() {
                const params = {
                    page: this.page,
                    pageSize: this.pageSize,
                    merchantName: this.input? this.input : undefined,
                    createTimeStart: this.createTimeRange[0]? this.createTimeRange[0] : undefined,
                    createTimeEnd: this.createTimeRange[1]? this.createTimeRange[1] : undefined,
                    updateTimeStart: this.updateTimeRange[0]? this.updateTimeRange[0] : undefined,
                    updateTimeEnd: this.updateTimeRange[1]? this.updateTimeRange[1] : undefined,
                    auditStatus: this.auditStatus? this.auditStatus : undefined,
                    auditComment: this.auditComment? this.auditComment : undefined
                }
                console.log(params);
                await getMerchantPage(params).then(res => {
                    if (res.code === 1) {
                        this.tableData = res.data || []
                        this.counts = res.data.length
                        // console.log(res.data)
                    }
                }).catch(err => {
                    this.$message.error('请求出错了：' + err)
                })
            },
            handleQuery() {
                this.page = 1;
                this.init();
            },
            // 重置查询条件
            resetQuery() {
                this.input = '';
                this.createTimeRange = [];
                this.updateTimeRange = [];
                this.auditStatus = '';
                this.auditComment = '';
                this.page = 1;
                this.init();
            },
            // 添加
            addMerchantHandle(st) {
                if (st === 'add') {
                    window.parent.menuHandle({
                        id: '2',
                        url: '/admin/page/merchant/add.html',
                        name: '添加商家'
                    }, true)
                } else {
                    window.parent.menuHandle({
                        id: '2',
                        url: '/admin/page/merchant/add.html?id=' + st,
                        name: '修改商家'
                    }, true)
                }
            },
            // 审核操作
            statusHandle(row) {
                this.id = row.id
                this.$prompt('请输入审核意见', '审核商家', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                }).then(({ value }) => {
                    auditMerchant(this.id, value).then(res => {
                        if (res.code === 1) {
                            this.$message.success('审核操作成功！')
                            this.handleQuery()
                        }

                    }).catch(err => {
                        this.$message.error('请求出错了：' + err)
                    })
                }).catch(() => {
                    this.$message({
                        type: 'info',
                        message: '取消审核操作'
                    });
                });
                this.handleQuery()
            },
            handleSizeChange(val) {
                this.pageSize = val
                this.init()
            },
            handleCurrentChange(val) {
                this.page = val
                this.init()
            }
        }
    })
</script>
</body>

</html>
