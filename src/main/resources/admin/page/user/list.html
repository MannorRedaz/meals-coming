<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="../../plugins/element-ui/index.css"/>
    <link rel="stylesheet" href="../../styles/common.css"/>
    <link rel="stylesheet" href="../../styles/page.css"/>
    <style>
        .search-btn {
            margin-left: 20px;
        }

        .tableBar {
            justify-content: flex-start !important;
        }

        .info-box {
            margin: -15px -44px 20px;
        }

        .info-box .item-box {
            display: flex;
            height: 20px;
            line-height: 20px;
            font-size: 14px;
            font-weight: 400;
            color: #666666;
            text-align: left;
            margin-bottom: 14px;
        }

        .info-box .item-box:last-child {
            margin-bottom: 0;
        }

        .info-box .item-box .label {
            width: 96px;
        }

        .info-box .item-box .des {
            flex: 1;
            color: #333333;
        }
    </style>
</head>
<body>
<div class="dashboard-container" id="user-app" v-loading="loading">
    <div class="container">
        <!-- 搜索项 -->
        <div class="tableBar">
            <el-input v-model="input" placeholder="请输入用户名" style="width: 250px">
                <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="init"></i>
            </el-input>
            <el-button type="primary" class="search-btn" @click="init">查询</el-button>
        </div>
        <el-table :data="tableData" stripe class="tableBox">
            <el-table-column prop="avatar" label="头像">
                <template slot-scope="{ row }">

                    <img :src="!row.avatar?'../../images/headPage.png' :
                    '/common/download?name=' + row.avatar" alt="" style="width: 40px; height: 40px; border-radius: 50%">
                </template>
            </el-table-column>
            <el-table-column prop="name" label="名称">
                <template slot-scope="{ row }">
                    <span>{{ row.name ? row.name : '-' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="phone" label="电话" show-overflow-tooltip></el-table-column>
            <el-table-column prop="sex" label="性别" min-width="100">
                <template slot-scope="{ row }">
                    <span>{{ row.sex === 1 ? "男" : '女' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="number" label="身份证号" min-width="110">
                <template slot-scope="{ row }">
                    <span>{{ "******************" }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="status" label="状态">
                <template slot-scope="{ row }">
                    <span>{{ row.status === 1 ? "正常" : '禁用' }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="btn" label="操作">
                <template slot-scope="{ row }">
                    <el-divider v-if="row.status === 0" direction="vertical"></el-divider>
                    <el-button v-if="row.status === 1" type="text" @click="changeStatus(0, row.id)"
                               class="blueBug">
                        禁用
                    </el-button>
                    <el-divider v-if="row.status === 0" direction="vertical"></el-divider>
                    <el-button v-if="row.status === 0" type="text" @click="changeStatus(1, row.id)"
                               class="blueBug">
                        启用
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
        <el-pagination
                class="pageList"
                :page-sizes="[10, 20, 30, 40]"
                :page-size="pageSize"
                :current-page.sync="page"
                layout="total, sizes, prev, pager, next, jumper"
                :total="counts"
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
        ></el-pagination>
    </div>
</div>
<!-- 开发环境版本，包含了有帮助的命令行警告 -->
<script src="../../plugins/vue/vue.js"></script>
<!-- 引入组件库 -->
<script src="../../plugins/element-ui/index.js"></script>
<!-- 引入axios -->
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/user.js"></script>
<script>
    new Vue({
        el: '#user-app',
        data() {
            return {
                input: '',
                orderTime: '',
                beginTime: '',
                endTime: '',
                counts: 0,
                page: 1,
                pageSize: 10,
                tableData: [],
                dialogVisible: false,
                diaForm: {},
                loading: false
            }
        },
        computed: {},
        watch: {
            orderTime(val) {
                if (val && val.length >= 2) {
                    this.beginTime = val[0]
                    this.endTime = val[1]
                } else {
                    this.beginTime = ''
                    this.endTime = ''
                }
            }
        },
        created() {
            this.init()
        },
        mounted() {
            // this.loading = false
        },
        methods: {
            async init() {
                getUserList({
                    page: this.page,
                    pageSize: this.pageSize,
                    name: this.input || undefined
                }).then(res => {
                    if (String(res.code) === '1') {
                        this.tableData = res.data.records || []
                        this.counts = res.data.total
                    }
                }).catch(err => {
                    this.$message.error('请求出错了：' + err)
                })
            },
            handleQuery() {
                this.page = 1;
                this.init();
            },
            changeStatus(status, id) {
                this.$confirm('确认更改该用户状态?', '提示', {
                    'confirmButtonText': '确定',
                    'cancelButtonText': '取消',
                    'type': 'warning'
                }).then(() => {
                    editUserStatus(params).then(res => {
                        if (res.code === 1) {
                            this.$message.success(status === 1 ? '用户启用成功' : '用户禁用成功')
                            this.init()
                        } else {
                            this.$message.error(res.msg || '操作失败')
                        }
                    }).catch(err => {
                        this.$message.error('请求出错了：' + err)
                    })
                })
                const params = {
                    status,
                    id
                }
            },
            handleClose() {
                this.dialogVisible = false
            },
            handleSizeChange(val) {
                this.pageSize = val
                this.init()
            },
            handleCurrentChange(val) {
                this.page = val
                this.init()
            }
        }
    })
</script>
</body>
</html>
