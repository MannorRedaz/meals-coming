<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0,user-scalable=no,minimal-ui">
    <title>发起投诉</title>
    <link rel="icon" href="../images/favico.ico">
    <!--不同屏幕尺寸根字体设置-->
    <script src="../js/base.js"></script>
    <!--element-ui的样式-->
    <link rel="stylesheet" href="../../backend/plugins/element-ui/index.css"/>
    <!--引入vant样式-->
    <link rel="stylesheet" href="../styles/vant.min.css"/>
    <!-- 引入样式  -->
    <link rel="stylesheet" href="../styles/index.css"/>
    <!--本页面内容的样式-->
    <link rel="stylesheet" href="../styles/complaint-edit.css"/>
</head>
<body>
<div id="address_edit" class="app">
    <div class="divHead">
        <div class="divTitle">
            <i class="el-icon-arrow-left" @click="goBack"></i>{{title}}
        </div>
    </div>
    <div class="divContent">
        <div class="divItem">
            <span>投诉内容：</span>
            <el-input placeholder="请填写投诉的内容" v-model="form.complaintContent" maxlength='10' class="inputUser"/>
            </el-input> </div>
        <div class="divItem">
            <span>投诉对象：</span>
            <el-input placeholder="对象描述，如订单号，商家等" style="width:150%" v-model="form.complantObjectId" maxlength='10' class="inputUser"/>
            </el-input>
        </div>
        <div class="divItem ">
            <span>投诉类型：</span>
            <span v-for="(item,index) in labelList" :key="index" @click="form.complaintType = item;activeIndex = index"
                  :class="{spanItem:true,spanActiveSchool:activeIndex === index}">{{item}}</span>
        </div>
        <div class="divSave" @click="saveComplaint">发起投诉</div>
    </div>
</div>
<!-- 开发环境版本,包含了有帮助的命令行警告 -->
<script src="../../backend/plugins/vue/vue.js"></script>
<!-- 引入组件库 -->
<script src="../../backend/plugins/element-ui/index.js"></script>
<!-- 引入vant样式 -->
<script src="../js/vant.min.js"></script>
<script src="../js/common.js"></script>
<script src="../api/complaint.js"></script>
<!-- 引入axios -->
<script src="../../backend/plugins/axios/axios.min.js"></script>
<script src="../js/request.js"></script>
<script>
    new Vue({
        el: "#address_edit",
        data() {
            return {
                title: '新增收货地址',
                form: {
                    id: 234,
                    complaintType: '服务问题',
                    complaintContent: '',//
                    userId: 1,
                    handingStatus: '',//
                    handingResult: '',//
                    handingTime: '',//
                    complantObjectId: '',//
                },
                labelList: [
                    '服务问题', '菜品问题', '订单问题', '其他'
                ],
                id: undefined,
                activeIndex: 0
            }
        },
        computed: {},
        created() {
            this.initData()
        },
        mounted() {
        },
        methods: {
            goBack() {
                history.go(-1)
            },
            async initData() {
                const params = parseUrl(window.location.search)
                this.id = params.id
                if (params.id) {
                    this.title = '编辑收货地址'
                    const res = await complaintFindOneApi(params.id)
                    if (res.code === 1) {
                        this.form = res.data
                    } else {
                        this.$notify({type: 'warning', message: res.msg});
                    }
                }
            },
            async saveComplaint() {
                const form = this.form
                if (!form.complaintType) {
                    this.$notify({type: 'warning', message: '请输入投诉类型'});
                    return
                }
                if (!form.complaintContent) {
                    this.$notify({type: 'warning', message: '请输入投诉内容'});
                    return
                }
                if (!form.complantObjectId) {
                    this.$notify({type: 'warning', message: '请输入投诉对象描述'});
                    return
                }

                let res = {}
                if (this.id) {
                    res = await updateComplaintApi(this.form)
                } else {
                    res = await addComplaintApi(this.form)
                }

                if (res.code === 1) {
                    window.requestAnimationFrame(() => {
                        window.location.replace('/front/page/complaint.html')
                    })
                } else {
                    this.$notify({type: 'warning', message: res.msg});
                }
            }
        }
    })
</script>
</body>
</html>
