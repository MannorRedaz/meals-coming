<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Receive Page</title>
</head>
<body>
<p id="result"></p>
<script>
  // 获取 URL 参数
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  // 显示接收到的 ID
  const resultElement = document.getElementById('result');
  resultElement.textContent = `Received ID: ${id}`;
</script>
</body>
</html>
