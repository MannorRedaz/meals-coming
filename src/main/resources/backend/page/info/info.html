<script src="../../plugins/vue/vue.js"></script>

<script>
    new Vue({
        el: '#merchant-audit-modify-app',
        data() {
            return {
                id: '',
                data: {
                    merchantDetails: {},
                    merchantAudit: {}
                },
                imageUrl: ""
            };
        },
        computed: {},
        created() {
            const urlParams = new URLSearchParams(window.location.search);
            this.id = urlParams.get('id');
            this.init();
        },
        mounted() {
        },
        methods: {
            async init() {
                getMerchantDetail(this.id).then(res => {
                    if (res.data.code === 1) {
                        this.data = res.data.data;
                        this.imageUrl = this.data.merchantDetails.businessLicense
                    } else {
                        this.$message.error(res.msg || '操作失败');
                    }
                });
            },
            goBack() {
                window.parent.menuHandle({
                    id: '1',
                    name: '流水统计',
                    url: 'page/statistic/manage.html',
                }, false);
            },
            async submitForm() {
                // const res = await updateMerchantInfo(this.id, this.data);

                try {
                    const res = await updateMerchantInfo(this.data);
                    console.log(res);
                    if (res.data) {
                        this.$message.success('保存成功');
                        // window.parent.menuHandle({
                        //     id: '1',
                        //     name: '流水统计',
                        //     url: 'page/statistic/manage.html',
                        // }, false);
                    } else {
                        this.$message.error(res.msg || '保存失败');
                    }
                } catch (error) {
                    this.$message.error('请求出错，请稍后重试');
                }
            },
            handleAvatarSuccess(response, file, fileList) {
                // 拼接down接口预览
                if (response.code === 0 && response.msg === '未登录') {
                    window.top.location.href = '/backend/page/login/login.html'
                } else {
                    this.imageUrl = `/common/download?name=${response.data}`
                    this.data.merchantDetails.businessLicense = `/common/download?name=`+response.data
                }
            },

            onChange(file) {
                if (file) {
                    const suffix = file.name.split('.')[1]
                    const size = file.size / 1024 / 1024 < 2
                    if (['png', 'jpeg', 'jpg'].indexOf(suffix) < 0) {
                        this.$message.error('上传图片只支持 png、jpeg、jpg 格式！')
                        this.$refs.upload.clearFiles()
                        return false
                    }
                    if (!size) {
                        this.$message.error('上传文件大小不能超过 2MB!')
                        return false
                    }
                    console.log("last:" + this.imageUrl)
                    return file
                }
            }
        }
    });
</script>
