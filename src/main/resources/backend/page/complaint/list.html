<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户投诉中心</title>
    <!-- 引入样式 -->
    <link rel="stylesheet" href="../../plugins/element-ui/index.css"/>
    <link rel="stylesheet" href="../../styles/common.css"/>
    <link rel="stylesheet" href="../../styles/page.css"/>
    <style>
        .search-btn {
            margin-left: 20px;
        }

        .tableBar {
            justify-content: flex-start !important;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }

        /* 当页面宽度小于 768px 时，调整布局 */
        @media (max-width: 768px) {
            .tableBar {
                flex-direction: column;
                align-items: flex-start;
            }

            .search-btn {
                margin-left: 0;
            }
        }

        .info-box {
            margin: -15px -44px 20px;
        }

        .info-box .item-box {
            display: flex;
            height: 20px;
            line-height: 20px;
            font-size: 14px;
            font-weight: 400;
            color: #666666;
            text-align: left;
            margin-bottom: 14px;
        }

        .info-box .item-box:last-child {
            margin-bottom: 0;
        }

        .info-box .item-box .label {
            width: 150px; /* 这里将宽度修改为150px，你可以根据需要调整 */
        }

        .info-box .item-box .des {
            flex: 1;
            color: #333333;
        }
    </style>
</head>

<body>
<div class="dashboard-container" id="complaint-app" v-loading="loading">
    <div class="container">
        <!-- 搜索项 -->
        <div class="tableBar">
            <el-input v-model="input" placeholder="请输入用户ID" style="width: 250px">
                <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="init"></i>
            </el-input>
            <el-select v-model="complaintType" placeholder="请选择投诉建议类型">
                <el-option v-for="item in complaintTypes" :key="item" :label="item" :value="item">
                </el-option>
            </el-select>
            <el-select v-model="handlingStatus" placeholder="请选择处理状态">
                <el-option v-for="item in handlingStatusList" :key="item" :label="item" :value="item">
                </el-option>
            </el-select>
            <el-button type="primary" class="search-btn" @click="init">查询</el-button>
        </div>
        <el-table :data="tableData" stripe class="tableBox">
            <!--            <el-table-column prop="id" label="主键" min-width="80"></el-table-column>-->
            <el-table-column prop="complaintType" label="投诉建议类型" min-width="120"></el-table-column>
            <el-table-column prop="complaintContent" label="投诉建议内容" show-overflow-tooltip></el-table-column>
            <el-table-column prop="userId" label="用户ID" min-width="80"></el-table-column>
            <el-table-column prop="handlingStatus" label="处理状态" min-width="100">
                <template slot-scope="{ row }">
                    <span>{{ row.handlingStatus }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="handlingResult" label="处理结果" show-overflow-tooltip></el-table-column>
            <el-table-column prop="handlingTime" label="处理时间" min-width="160"></el-table-column>
            <el-table-column prop="btn" label="操作">
                <template slot-scope="{ row }">
                    <el-button type="text" @click="goDetail(row)" class="blueBug">
                        查看
                    </el-button>
                    <!-- 添加处理按钮 -->
                    <el-button type="text" @click="handleComplaint(row)" class="blueBug">
                        处理
                    </el-button>
                </template>
            </el-table-column>
        </el-table>
        <el-pagination
                class="pageList"
                :page-sizes="[10, 20, 30, 40]"
                :page-size="pageSize"
                :current-page.sync="page"
                layout="total, sizes, prev, pager, next, jumper"
                :total="counts"
                @size-change="handleSizeChange"
                @current-change="handleCurrentChange"
        ></el-pagination>
    </div>

    <!-- 查看弹框部分 -->
    <el-dialog
            title="投诉建议详情"
            :visible.sync="dialogVisible"
            width="30%"
            :before-close="handleClose">
        <div class="info-box">
            <div class="item-box">
                <span class="label">用户id：</span>
                <span class="des">{{ diaForm.userId }}</span>
            </div>
            <div class="item-box">
                <span class="label">投诉建议类型：</span>
                <span class="des">{{ diaForm.complaintType }}</span>
            </div>
            <div class="item-box">
                <span class="label">投诉建议内容：</span>
                <span class="des">{{ diaForm.complaintContent }}</span>
            </div>
            <!--            <div class="item-box">-->
            <!--                <span class="label">用户ID：</span>-->
            <!--                <span class="des">{{ diaForm.userId }}</span>-->
            <!--            </div>-->
            <div class="item-box">
                <span class="label">处理状态：</span>
                <span class="des">{{ diaForm.handlingStatus }}</span>
            </div>
            <div class="item-box">
                <span class="label">处理结果：</span>
                <span class="des">{{ diaForm.handlingResult }}</span>
            </div>
            <div class="item-box">
                <span class="label">处理时间：</span>
                <span class="des">{{ diaForm.handlingTime }}</span>
            </div>
        </div>
    </el-dialog>
    <!-- 处理弹框部分 -->
    <el-dialog
            title="处理投诉建议"
            :visible.sync="handleDialogVisible"
            width="30%"
            :before-close="handleHandleClose">
        <div style="padding: 15px;">
            <el-input v-model="handleForm.handlingResult" placeholder="请输入处理结果"
                      style="width: 100%; margin-bottom: 15px;"></el-input>
            <el-switch v-model="handleForm.handlingStatus" active-text="已处理" inactive-text="未处理"
                       style="margin-bottom: 15px;"></el-switch>
            <!-- 对话框底部 -->
            <div slot="footer" style="display: flex; justify-content: space-between; padding: 0 15px 15px;">
                <el-button @click="handleHandleClose">取消</el-button>
                <el-button type="primary" @click="submitHandleForm">确定</el-button>
            </div>
        </div>
    </el-dialog>
</div>
<!-- 开发环境版本，包含了有帮助的命令行警告 -->
<script src="../../plugins/vue/vue.js"></script>
<!-- 引入组件库 -->
<script src="../../plugins/element-ui/index.js"></script>
<!-- 引入axios -->
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/complaint.js"></script>
<script>
    new Vue({
        el: '#complaint-app',
        data() {
            return {
                input: '',
                complaintType: '',
                handlingStatus: '',
                complaintTypes: ['菜品问题', '服务问题'], // 可根据实际情况修改
                handlingStatusList: ['待处理', '已处理'], // 可根据实际情况修改
                counts: 0,
                page: 1,
                pageSize: 10,
                tableData: [],
                dialogVisible: false,
                diaForm: {},
                handleDialogVisible: false,
                handleForm: {
                    handlingResult: '',
                    handlingStatus: false
                },
                loading: false
            }
        },
        computed: {},
        watch: {},
        created() {
            this.init()
        },
        mounted() {
            // this.loading = false
        },
        methods: {

            async init() {
                // 发起分页查询接口请求，传递查询条件
                getComplaintList(this.page, this.pageSize, this.input, this.complaintType, this.handlingStatus)
                    .then(response => {
                        // console.log(response.data);
                        // console.log(this.page, this.pageSize, this.input, this.complaintType, this.handlingStatus)
                        let res = response.data
                        // console.log("点击查询")
                        if (res.code === 1) {
                            this.tableData = res.data.records;
                            this.counts = res.data.total;
                            // console.log(this.tableData)
                            // console.log(this.counts)
                        } else {
                            this.$message.error(res.msg);
                        }
                    })
                    .catch(error => {
                        console.error('请求出错:', error);
                    });
            },
            handleReset() {
                this.input = '';
                this.complaintType = '';
                this.handlingStatus = '';
                this.page = 1;
                this.init();
            },


            handleQuery() {
                this.page = 1;
                this.init();
            },
            // 查看详情
            goDetail(row) {
                this.diaForm = {};
                this.dialogVisible = true;
                this.diaForm = {...row};
            },
            handleClose() {
                this.dialogVisible = false;
            },
            handlePageChange(val) {
                this.page = val;
                this.init();
            },
            handleSizeChange(val) {
                this.pageSize = val;
                this.handlePageChange(this.page);
            },
            handleCurrentChange(val) {
                this.handlePageChange(val);
            },
            // 处理投诉建议
            handleComplaint(row) {
                this.handleDialogVisible = true;
                this.handleForm.handlingResult = row.handlingResult;
                this.handleForm.handlingStatus = row.handlingStatus === '已处理';
                this.handleForm.id = row.id; // 保存当前数据的ID，用于更新
            },
            handleHandleClose() {
                this.handleDialogVisible = false;
            },
            async submitHandleForm() {
                const formData = {
                    id: this.handleForm.id,
                    handlingResult: this.handleForm.handlingResult,
                    handlingStatus: this.handleForm.handlingStatus ? '已处理' : '待处理'
                };
                const response = await updateComplaint(formData);
                // console.log(response.data.code === 1)
                // console.log(response.data.code)
                // console.log(response.data)
                try {
                    if (response.data && response.code === 1) {
                        this.$message.success('处理成功');
                        this.handleDialogVisible = false;
                        this.init();
                    } else if (response && response.data) {
                        this.$message.error(response.data.msg);
                    } else {
                        this.$message.error('请求返回数据格式错误');
                    }
                } catch (error) {
                    // console.error('请求出错:', error);
                    this.$message.error('请求出错，请稍后重试');
                }
            }
        }
    })
</script>
</body>

</html>
